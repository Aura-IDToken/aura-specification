name: Draft Conformance

on:
  push:
  pull_request:

jobs:
  draft-conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install "jcs==0.2.1" "jsonschema==4.10.3"

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Run repository reference-hygiene check
        run: python scripts/check-reference-hygiene.py --json-out artifacts/reference-hygiene-report.json

      - name: Run draft conformance runner
        run: python scripts/run-draft-conformance.py --json-out artifacts/draft-conformance-report.json

      - name: Upload conformance and reference-hygiene reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-and-reference-hygiene-reports
          path: |
            artifacts/draft-conformance-report.json
            artifacts/reference-hygiene-report.json
          if-no-files-found: ignore
